# Proyecto de Cloudflare Pages.
#
# El nombre debe coincidir con `cloudflare.projectName` de site.config.json; hay
# una prueba que lo comprueba. El artefacto es el mismo `dist/` que publica
# GitHub Pages, construido con `npm run build:cloudflare`.
#
# Las Pages Functions (la negociación `Accept: text/markdown`) viven en
# `functions/` en la raíz del repositorio, NO dentro de `dist/`: Cloudflare las
# compila aparte y el build las mantiene fuera del artefacto público a propósito.
name = "chiclove-ec"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"
